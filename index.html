  <input type="text" name ="" id="todo">
  <button onclick="CopyName()">Get some words</button>
  <div id="resultsTest">
    Your name is...
  </div>
  <script>
    fetch('https://jsonplaceholder.typicode.com/todos')
      .then(response => response.json())
      .then(json => console.log(json))

    function CopyName(){
      let newEL = document.createElement("p"); // ประกาศตัวแปรเพื่อสร้าง p ใหม่
      newEL.innerHTML = document.getElementById('todo').value; // ใส่ข้อความลงใน p ที่สร้างขึ้น โดยใช้ค่าจาก input type
      let result02= document.getElementById('resultsTest'); // หาตำแหน่งที่จะใส่ค่า p และเพิ่มค่าเข้าไป โดยอ้างอิงไปที่ id ของ div หรือ p นั้นๆ
      result02.appendChild(newEL); 
      document.getElementById("todo").value = "" // กำหนดให้ input เป็นค่าว่าง 
    }
  </script>
